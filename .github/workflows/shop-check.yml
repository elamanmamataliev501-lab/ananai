name: Ananai storefront browser checks
on:
  push:
    branches: [ananai-storefront-checks-1128]
permissions:
  contents: read
  id-token: write
jobs:
  storefront:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: python -m pip install playwright==1.56.0
      - run: python tests/shop_test.py
